<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; }
        .container { display: flex; gap: 15px; }
        #locations { width: 250px; flex-shrink: 0; }
        #map { flex: 1; height: 800px; }
        .popup-image { max-width: 250px; height: auto; }
        .location { padding: 10px; border-bottom: 1px solid #ddd; cursor: pointer; }
        .location:hover { background: #eee; }
    </style>
</head>
<body>
    <h1>Simple Maps</h1>

    <div class="container">
        <div id="locations">
            <h3>Locations</h3>
            <div id="location-list"></div>
        </div>
        <div id="map"></div>
    </div>

    <script>
    function initMap(mapDataUrl) {
        const map = L.map('map').setView([8.360, 124.868], 17);

        const openStreetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        });

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community'
        });
        satellite.addTo(map);

        L.control.layers({
            "OpenStreetMap": openStreetMap,
            "Satellite": satellite
        }).addTo(map);

        fetch(mapDataUrl)
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(data => {
                data.forEach(pin => {
                    const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                    marker.bindPopup(`
                        <strong>${pin.title}</strong><br><hr>
                        <img src="${pin.image}" class="popup-image">
                    `);

                    // Sidebar item (naa na sa sulod sa loop)
                    const item = document.createElement('div');
                    item.className = 'location';
                    item.textContent = pin.title;
                    item.onclick = () => {
                        map.flyTo([pin.lat, pin.lng], 18);
                        marker.openPopup();
                    };
                    document.getElementById('location-list').appendChild(item);
                });
            })
            .catch(err => console.error('Failed to load map data:', err));
    }

    initMap('campus-map.json');
    </script>
</body>
</html>
